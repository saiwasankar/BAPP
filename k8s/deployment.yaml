apiVersion: apps/v1
kind: Deployment
metadata:
  name: bapps-backend
  labels:
    app: bapps-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bapps-backend
  template:
    metadata:
      labels:
        app: bapps-backend
    spec:
      containers:
        - name: api
          image: docker.io/saiw27/cicd:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: BAPPS_DB_PATH
              value: /data/bapps.db
            - name: BAPPS_ALLOW_RESET
              value: "0"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bapps-data
